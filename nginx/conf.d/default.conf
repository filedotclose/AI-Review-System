upstream backend_api {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_ui {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Rate limiting custom JSON response with CORS headers for API and auth breaches
    error_page 429 @rate_limit_exceeded;
    location @rate_limit_exceeded {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        return 429 '{"detail":"Too many requests. Please slow down and try again shortly."}';
    }

    # API Gateway Error JSON response (replaces ugly HTML 502/503/504 when backend restarts)
    error_page 500 502 503 504 @api_gateway_error;
    location @api_gateway_error {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        return 502 '{"detail":"Backend service temporarily unavailable. Please retry shortly."}';
    }

    # Payload Too Large JSON response (handles oversized file/image payloads cleanly)
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 413 '{"detail":"Payload too large. Maximum allowable request size is 25MB."}';
    }

    # 1. Health check endpoints (for AWS ALB, Docker, uptime monitors)
    # Matches with and without trailing slash: /health, /health/, /healthz, /healthz/, /api/health, /api/v1/health
    location ~ ^/(health|healthz|api/health|api/v1/health)(?:/|$) {
        access_log off;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Nginx dedicated health check (both exact and trailing slash)
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx"}';
    }
    location = /nginx-health/ {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx"}';
    }

    # 2. High-Security Route: Auth & Session Management (Strict Rate Limit: 3r/s, burst=5)
    # Matches /api/v1/auth, /api/v1/auth/, /api/auth, /api/auth/ and all subpaths (/login, /me, etc.)
    location ~ ^/api/(?:v1/)?auth(?:/|$) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 3. Interactive API Documentation & OpenAPI schema
    # Supports /docs, /redoc, /openapi.json, /api/docs, /api/v1/docs, /api/openapi.json, etc.
    location ~ ^/(docs|redoc|openapi\.json|api/(?:v1/)?(?:docs|redoc|openapi\.json))(?:/|$) {
        limit_req zone=api_limit burst=10 nodelay;

        # Rewrite /api/docs or /api/v1/docs -> /docs, /api/openapi.json -> /openapi.json
        rewrite ^/api/(?:v1/)?(docs|redoc|openapi\.json)(.*)$ /$1$2 break;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 4. General API Endpoints
    # Matches /api, /api/, /api/v1, /api/v1/ and all business domain endpoints
    # (/api/v1/dpr, /api/v1/fuel, /api/v1/petty-cash, /api/v1/attendance, /api/v1/brief, /api/dpr, etc.)
    location /api {
        limit_req zone=api_limit burst=15 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 5. Next.js Static Chunks Caching (Immense CPU & Memory Savings)
    location ^~ /_next/static/ {
        proxy_pass http://frontend_ui;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 6. PWA Service Worker & Web App Manifest (Do not aggressively cache)
    location ~ ^/(sw\.js|workbox-[a-f0-9]+\.js|manifest\.json)$ {
        proxy_pass http://frontend_ui;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 7. Frontend UI & Web Application Routes
    location / {
        limit_req zone=general_limit burst=40 nodelay;

        proxy_pass http://frontend_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
