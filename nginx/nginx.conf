user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Information Disclosure Hardening
    server_tokens off;

    # Request Buffer Limits (Mitigate Slowloris & Buffer Overflow DoS)
    client_max_body_size        25M;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;

    # Gzip Compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Multi-Tier Rate Limiting Zones (Memory Key: $binary_remote_addr)
    # 1. Strict Auth Limit: 3 requests/sec (protects against PIN/Password brute force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

    # 2. General API Limit: 10 requests/sec (protects backend FastAPI endpoints)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 3. Web Navigation & Static Limit: 25 requests/sec (Next.js pages & chunks)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=25r/s;

    # Standard Return Code when threshold breached
    limit_req_status 429;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
